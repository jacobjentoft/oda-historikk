name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task lint
      - run: deno task check
      - run: deno task test

  migrations:
    # Apply every migration to a throwaway Supabase stack, so a migration that
    # only works against the live project (or not at all) fails here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starting the local stack applies every migration in order.
      - run: supabase db start
